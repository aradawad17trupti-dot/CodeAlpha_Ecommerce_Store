<!DOCTYPE html>
<html>
<head>
    <title>Order Success</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; text-align: center; }
        .container { max-width: 500px; margin: auto; background: white; padding: 40px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #28a745; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Order Placed Successfully! 🎉</h2>
        <p>Thank you, <strong>{{ order.first_name }}</strong>! Your order has been placed successfully.</p>
        <p>Order ID: <strong>#{{ order.id }}</strong></p>
        <a href="{% url 'product_list' %}" class="btn">Back to Store</a>
    </div>
</body>
</html>
